[flake8]
ignore = E711,E712,D100,D101,D103,D102,D301
max-line-length = 100
exclude = .tox

[tool:pytest]
testpaths = agrobase
mock_use_standalone_module = true
filterwarnings =
    ignore::sqlalchemy.exc.SAWarning
    ignore::sqlalchemy.exc.RemovedIn20Warning
# addopts =
#     --cov=agrobase
#     --cov-report term-missing

[compile_catalog]
directory = agrobase/locale
domain = clld
statistics = true

[extract_messages]
add_comments = TRANSLATORS:
output_file = agrobase/locale/agrobase.pot
width = 80

[init_catalog]
domain = clld
input_file = agrobase/locale/agrobase.pot
output_dir = agrobase/locale

[update_catalog]
domain = clld
input_file = agrobase/locale/agrobase.pot
output_dir = agrobase/locale
previous = true
